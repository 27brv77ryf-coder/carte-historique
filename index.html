<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte historique</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([47.7757, 0.8907], 18);


/* Fond OpenStreetMap */

var osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        minZoom: 10,
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* Carte historique */

var historique = L.tileLayer(
    'cartes/test_roches/{z}/{x}/{y}.png',
    {
        minZoom: 10,
        maxZoom: 20,
        opacity: 1,
        attribution: 'Carte historique'
    }
);


/* Bouton de sélection des couches */

var couchesBase = {
    "OpenStreetMap": osm
};

var couchesSuperposees = {
    "Carte historique": historique
};

L.control.layers(
    couchesBase,
    couchesSuperposees,
    {
        collapsed: false
    }
).addTo(map);

</script>

</body>
</html>
