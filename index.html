<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte historique</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* Carte centrée sur Les Roches-l'Évêque */
var map = L.map('map').setView([47.7757, 0.8907], 18);


/* Fond OpenStreetMap */
var osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* Test de la tuile historique */
var historique = L.tileLayer(
    '18/{x}/{y}.png',
    {
        minZoom: 18,
        maxZoom: 18,
        opacity: 0.8,
        attribution: 'Carte historique'
    }
);


/* Menu des couches */
L.control.layers(
    {
        "OpenStreetMap": osm
    },
    {
        "Carte historique": historique
    }
).addTo(map);

</script>

</body>
</html>
