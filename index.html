<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Simple</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <style>
    html, body, #carte { margin:0; padding:0; height:100%; width:100%; }
  </style>
</head>
<body>
  <div id="carte"></div>
  <script>
    // Une carte simple centrée sur la France, sans piège
    var map = L.map('carte').setView([46.6033, 1.8883], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
  </script>
</body>
</html>
